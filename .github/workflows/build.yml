name: Builder tests
on: [push, pull_request, workflow_dispatch]
jobs:
  builder:
    name: Builder tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test builder
        run: python -m unittest discover -s tests -p 'test_build*.py' -v

  # No game assets or generated game code exist here (copyright): only tests that
  # compile repository sources and use synthetic data run. tests/needs_generated.txt
  # lists the ones that need src/recomp/gen and are run locally.
  contracts:
    name: Asset-free contracts (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Python dependencies
        run: python -m pip install pillow numpy scipy
      - name: No game assets tracked
        run: python -m unittest tests.test_no_game_assets -v
        env:
          PYTHONPATH: .
      - name: Contracts and unit tests
        shell: pwsh
        run: tools/run_regressions.ps1 -CI
        env:
          # The default TEMP is an 8.3 short path (RUNNER~1); path comparisons in the car-tools tests
          # fail against its resolved long form.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}

  # The same asset-free contracts on Linux with GCC: it builds the sources the game's Linux
  # port shares (the platform layer, the mods, the launcher settings) and catches POSIX-only
  # breakage that the Windows job cannot see. A venv over the system Python keeps apt's Tk
  # (the car editor test needs a display) while pip supplies a Pillow that can write DXT
  # (Ubuntu's 10.x cannot; the texture tests need the version Windows CI gets).
  contracts-linux:
    name: Asset-free contracts (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-venv python3-tk xvfb
          /usr/bin/python3 -m venv --system-site-packages "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install pillow numpy scipy
      - name: No game assets tracked
        run: ${{ runner.temp }}/venv/bin/python -m unittest tests.test_no_game_assets -v
        env:
          PYTHONPATH: .
      - name: Contracts and unit tests
        run: xvfb-run -a tools/run_regressions.sh --ci
        env:
          PYTHON: ${{ runner.temp }}/venv/bin/python
