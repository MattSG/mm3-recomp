name: Build and test
on: [push, pull_request, workflow_dispatch]
jobs:
  contracts:
    name: Asset-free contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test builder
        run: python -m unittest discover -s tests -p test_build_gui.py -v
      - name: Configure contracts
        run: cmake -S tools/xboxrecomp/tests/guest_read -B build-contracts
      - name: Build contracts
        run: cmake --build build-contracts --config Debug --parallel
      - name: Test contracts
        run: ctest --test-dir build-contracts -C Debug --output-on-failure
