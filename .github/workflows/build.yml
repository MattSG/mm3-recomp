name: Builder tests
on: [push, pull_request, workflow_dispatch]
jobs:
  builder:
    name: Builder tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test builder
        run: python -m unittest discover -s tests -p 'test_build*.py' -v

  # No game assets or generated game code exist here (copyright): only tests that
  # compile repository sources and use synthetic data run. tests/needs_generated.txt
  # lists the ones that need src/recomp/gen and are run locally.
  contracts:
    name: Asset-free contracts (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Python dependencies
        run: python -m pip install pillow numpy scipy
      - name: No game assets tracked
        run: python -m unittest tests.test_no_game_assets -v
        env:
          PYTHONPATH: .
      - name: Contracts and unit tests
        shell: pwsh
        run: tools/run_regressions.ps1 -CI
        env:
          # The default TEMP is an 8.3 short path (RUNNER~1); path comparisons in the car-tools tests
          # fail against its resolved long form.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
